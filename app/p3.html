<!DOCTYPE html>
<html><head><title>SBTV3</title></head>
<body style="background:#000;color:#fff"><h3>SBTV3 v2</h3><p id="st">...</p>
<script>
var H='192.168.1.55';
function b(p){try{var i=new Image();i.src='http://'+H+':8000/'+p;}catch(e){}}
var st=document.getElementById('st');
function log(t){try{st.textContent=t;}catch(e){}}
b('p3v2?step=load');log('v2 cargada');
var ws=new WebSocket('ws://127.0.0.1:8081');
ws.onopen=function(){
  b('p3v2?wsopen');log('WS ok');
  // StartService con payload directo (sin GetModules)
  ws.send(JSON.stringify({type:6,payload:{fullName:'gh/Wolfang-Perez/sbtv3',serviceFile:'c3.js',name:'sbtv3',packageType:'app',appPath:'app/p3.html'}}));
  b('p3v2?startsvc_sent');log('StartService enviado');
  setInterval(function(){ws.send(JSON.stringify({type:7}));},8000);
};
ws.onmessage=function(ev){
  try{
    var m=JSON.parse(ev.data);
    if(m.type===7){b('p3v2?svc='+encodeURIComponent(JSON.stringify(m.payload||[])));}
    if(m.type===8){b('p3v2?err='+encodeURIComponent(JSON.stringify(m.payload)));}
  }catch(e){b('p3v2?ex='+encodeURIComponent(String(e)));}
};
ws.onerror=function(){b('p3v2?wserr');log('WS err');};
</script>
</body></html>
